services:
  - type: web
    name: blockchain-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: ADMIN_EMAIL_FROM
        sync: false
      - key: ADMIN_EMAIL_TO
        sync: false
